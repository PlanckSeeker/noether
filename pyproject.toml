[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noether"
version = "0.1.0"
description = "An epistemic physics reasoning engine and symbolic APL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
{ name = "Ayoub" }
]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Science/Research",
"Topic :: Scientific/Engineering :: Physics",
"Programming Language :: Python :: 3.12",
"License :: OSI Approved :: MIT License"
]
dependencies = [
# Core Symbolic & Algebraic Engine
"sympy>=1.13.0",
# Numerical Bounds & Fallbacks
"numpy>=2.0.0",
"scipy>=1.14.0",
# Empirical Ingestion (CSV & Astronomical FITS)
"pandas>=2.2.0",
"astropy>=6.1.0",
# UI & Epistemic Log Rendering
"pyside6>=6.7.0",
"matplotlib>=3.9.0"  # Required for rendering SymPy LaTeX to the UI canvas
]

[project.optional-dependencies]
dev = [
# Verification Gates & Testing
"pytest>=8.3.0",
"pytest-qt>=4.4.0",    # Crucial for headless testing of QAbstractListModel
# Formatting & Static Typing
"ruff>=0.6.0",
"mypy>=1.11.0"
]

[project.scripts]
noether-log = "noether.ui.app:main"
noether-eval = "noether.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noether"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py312"